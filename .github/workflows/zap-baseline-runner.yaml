name: OWASP ZAP Baseline Runner

run-name: ZAP baseline scan of ${{ inputs.target_url }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Public URL of the temporary application
        required: true
        default: "http://35.200.135.9"
        type: string

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    name: Run ZAP on GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate target URL
        shell: bash
        run: |
          TARGET_URL="${{ inputs.target_url }}"

          case "$TARGET_URL" in
            http://*|https://*)
              echo "Target URL format is valid."
              ;;
            *)
              echo "Target URL must begin with http:// or https://"
              exit 1
              ;;
          esac

          echo "Target: $TARGET_URL"

      - name: Verify target health before scan
        shell: bash
        run: |
          TARGET_URL="${{ inputs.target_url }}"

          for attempt in $(seq 1 20); do
            STATUS_CODE=$(curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              "${TARGET_URL}/health" || true)

            echo "Health attempt ${attempt}: HTTP ${STATUS_CODE}"

            if [ "$STATUS_CODE" = "200" ]; then
              echo "Target health check passed."
              exit 0
            fi

            sleep 15
          done

          echo "Target health check failed."
          exit 1

      - name: Run official OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ inputs.target_url }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          token: ${{ secrets.GITHUB_TOKEN }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline-runner-report-${{ github.run_number }}
          cmd_options: >-
            -m 2
            -I

      - name: Verify target health after scan
        if: always()
        shell: bash
        run: |
          STATUS_CODE=$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            "${{ inputs.target_url }}/health" || true)

          echo "Post-scan health: HTTP ${STATUS_CODE}"
          echo "## Post-scan validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: ${{ inputs.target_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runner: ubuntu-latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scan type: OWASP ZAP passive baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "- Post-scan health: HTTP ${STATUS_CODE}" >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS_CODE" != "200" ]; then
            echo "Application health failed after the scan."
            exit 1
          fi
