name: Build and deploy to GKE

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/student-registration

jobs:
  deploy:
    name: Build, deploy, and configure autoscaling
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        shell: bash
        run: |
          gcloud auth configure-docker \
            "${{ vars.GAR_LOCATION }}-docker.pkg.dev" \
            --quiet

      - name: Build and push immutable application image
        shell: bash
        run: |
          docker build \
            -t "$IMAGE:${GITHUB_SHA}" \
            .

          docker push "$IMAGE:${GITHUB_SHA}"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Apply application with immutable image and autoscaling
        shell: bash
        run: |
          kubectl apply \
            -f k8s/service-account.yaml \
            -f k8s/app-service.yaml \
            -f k8s/hpa.yaml \
            -f k8s/pod-disruption-budget.yaml \
            -f k8s/cloud-armor-backend-policy.yaml

          sed \
            "s|asia-south1-docker.pkg.dev/pe3-devops-training-svaranasi/pe3-app-images/student-registration:manual-v1|$IMAGE:${GITHUB_SHA}|g" \
            k8s/app-deployment.yaml \
            | kubectl apply -f -
      - name: Wait for successful rollout
        shell: bash
        run: |
          kubectl rollout status deployment/student-registration \
            --namespace="${{ vars.K8S_NAMESPACE }}" \
            --timeout=300s

      - name: Wait for minimum application Pods
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            READY_REPLICAS=$(kubectl get deployment student-registration \
              --namespace="${{ vars.K8S_NAMESPACE }}" \
              -o jsonpath='{.status.readyReplicas}')

            READY_REPLICAS=${READY_REPLICAS:-0}

            echo "Ready replicas: $READY_REPLICAS"

            if [ "$READY_REPLICAS" -ge 2 ]; then
              echo "Minimum Pod count is ready."
              exit 0
            fi

            sleep 10
          done

          echo "Two Ready Pods were not reached within the timeout."
          exit 1

      - name: Display deployment and autoscaling status
        shell: bash
        run: |
          kubectl get deployment student-registration \
            --namespace="${{ vars.K8S_NAMESPACE }}" \
            -o wide

          kubectl get horizontalpodautoscaler student-registration-hpa \
            --namespace="${{ vars.K8S_NAMESPACE }}" \
            -o wide

          kubectl get poddisruptionbudget student-registration-pdb \
            --namespace="${{ vars.K8S_NAMESPACE }}" \
            -o wide

          kubectl get pods \
            --namespace="${{ vars.K8S_NAMESPACE }}" \
            --selector=app=student-registration \
            -o wide

      - name: Verify public application health
        shell: bash
        run: |
          for attempt in $(seq 1 20); do
            STATUS_CODE=$(curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              https://test5.deltaintech.co.in/health || true)

            echo "Health status: $STATUS_CODE"

            if [ "$STATUS_CODE" = "200" ]; then
              echo "Public application health check passed."
              exit 0
            fi

            sleep 15
          done

          echo "Public application health check failed."
          exit 1

      - name: Add deployment summary
        shell: bash
        run: |
          {
            echo "## GKE Deployment and Autoscaling"
            echo ""
            echo "- Image: $IMAGE:${GITHUB_SHA}"
            echo "- Initial Pods: 2"
            echo "- HPA minimum Pods: 2"
            echo "- HPA maximum Pods: 5"
            echo "- HPA CPU target: 60%"
            echo "- Deployment strategy: RollingUpdate"
            echo "- Public health endpoint: Passed"
          } >> "$GITHUB_STEP_SUMMARY"
